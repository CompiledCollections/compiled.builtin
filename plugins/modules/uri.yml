DOCUMENTATION:
  module: uri
  short_description: Interacts with webservices
  description:
    - Compiled Go replacement for M(ansible.builtin.uri), with the same options and results.
      It does not need Python on the target.
    - Interacts with HTTP and HTTPS web services and supports Digest, Basic and WSSE HTTP authentication mechanisms.
    - Requests behave like the builtin's, which uses Python's urllib. The same headers are sent, redirects,
      authentication, cookies, proxies and errors are handled the same way, and results have the same keys.
  version_added: 1.0.0
  options:
    url:
      description:
        - HTTP or HTTPS URL in the form (http|https)://host.domain[:port]/path.
      type: str
      required: true
    dest:
      description:
        - A path of where to download the file to (if desired). If O(dest) is a
          directory, the basename of the file on the remote server will be used.
      type: path
    url_username:
      description:
        - A username for the module to use for Digest or Basic authentication.
      type: str
      aliases: [user]
    url_password:
      description:
        - A password for the module to use for Digest or Basic authentication.
      type: str
      aliases: [password]
    body:
      description:
        - The body of the http request/response to the web service. If O(body_format) is set
          to V(json) it will take an already formatted JSON string or convert a data structure into JSON.
        - If O(body_format) is set to V(form-urlencoded) it will convert a dictionary
          or list of tuples into an C(application/x-www-form-urlencoded) string.
        - If O(body_format) is set to V(form-multipart) it will convert a dictionary
          into C(multipart/form-multipart) body. Each value is a string, or a dictionary with C(filename),
          C(content), C(mime_type) and C(multipart_encoding) (V(base64) or V(7or8bit)).
      type: raw
    body_format:
      description:
        - The serialization format of the body. When set to V(json), V(form-multipart), or V(form-urlencoded), encodes
          the body argument, if needed, and automatically sets the C(Content-Type) header accordingly.
        - The C(Content-Type) header can be overridden with O(headers) for V(json) and V(form-urlencoded),
          but not for V(form-multipart).
      type: str
      choices: [form-urlencoded, json, raw, form-multipart]
      default: raw
    method:
      description:
        - The HTTP method of the request or response.
        - It must be a single word; any method the service accepts can be used.
      type: str
      default: GET
    return_content:
      description:
        - Whether or not to return the body of the response as a "content" key in
          the dictionary result no matter it succeeded or failed.
        - Independently of this option, if the reported C(Content-Type) is C(application/json), then the JSON is
          always loaded into a key called RV(ignore:json) in the dictionary results.
      type: bool
      default: false
    force_basic_auth:
      description:
        - Force the sending of the Basic authentication header upon initial request.
        - When this setting is V(false), this module will first try an unauthenticated request, and when the server replies
          with an C(HTTP 401) error, it will submit the Basic authentication header.
        - When this setting is V(true), this module will immediately send a Basic authentication header on the first
          request.
      type: bool
      default: false
    creates:
      description:
        - A filename, when it already exists, this step will not be run.
      type: path
    removes:
      description:
        - A filename, when it does not exist, this step will not be run.
      type: path
    status_code:
      description:
        - A list of valid, numeric, HTTP status codes that signifies success of the request.
      type: list
      elements: int
      default: [200]
    timeout:
      description:
        - The socket level timeout in seconds
      type: int
      default: 30
    headers:
      description:
        - Add custom HTTP headers to a request in the format of a YAML hash. Supplying C(Content-Type) here
          overrides the header generated by supplying V(json) or V(form-urlencoded) for O(body_format).
      type: dict
      default: {}
    validate_certs:
      description:
        - If V(false), SSL certificates will not be validated.
        - This should only set to V(false) used on personally controlled sites using self-signed certificates.
      type: bool
      default: true
    client_cert:
      description:
        - PEM formatted certificate chain file to be used for SSL client authentication.
        - This file can also include the key as well, and if the key is included, O(client_key) is not required.
      type: path
    client_key:
      description:
        - PEM formatted file that contains your private key to be used for SSL client authentication.
        - If O(client_cert) contains both the certificate and key, this option is not required.
      type: path
    ca_path:
      description:
        - PEM formatted file that contains a CA certificate to be used for validation.
      type: path
    src:
      description:
        - Path to file to be submitted to the remote server.
        - Cannot be used with O(body).
        - Should be used with O(force_basic_auth) to ensure success when the remote end sends a 401.
      type: path
    remote_src:
      description:
        - If V(false), the module will search for the O(src) on the controller node.
        - If V(true), the module will search for the O(src) on the managed (remote) node.
      type: bool
      default: false
    force:
      description:
        - If V(true) do not get a cached copy.
      type: bool
      default: false
    use_proxy:
      description:
        - If V(false), it will not use a proxy, even if one is defined in an environment variable on the target hosts.
      type: bool
      default: true
    unix_socket:
      description:
        - Path to Unix domain socket to use for connection.
      type: path
    http_agent:
      description:
        - Header to identify as, generally appears in web server logs.
      type: str
      default: ansible-httpget
    unredirected_headers:
      description:
        - A list of header names that will not be sent on subsequent redirected requests. This list is case
          insensitive. By default all headers will be redirected. In some cases it may be beneficial to list
          headers such as C(Authorization) here to avoid potential credential exposure.
      type: list
      elements: str
      default: []
    use_gssapi:
      description:
        - Not supported by this module, which fails when it is set; it exists for compatibility with M(ansible.builtin.uri).
        - GSSAPI (Kerberos) authentication needs the Python C(gssapi) library, which a compiled module can't use.
      type: bool
      default: false
    use_netrc:
      description:
        - Determining whether to use credentials from C(~/.netrc) file.
        - By default C(.netrc) is used with Basic authentication headers.
        - When V(false), C(.netrc) credentials are ignored.
      type: bool
      default: true
    ciphers:
      description:
        - SSL/TLS Ciphers to use for the request.
        - When a list is provided, all ciphers are joined in order with V(:).
        - Cipher names can be OpenSSL names (V(ECDHE-RSA-AES128-GCM-SHA256)) or IANA names
          (V(TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256)). OpenSSL keywords and operators such as V(HIGH) or V(!aNULL)
          are not supported and make the task fail.
        - Like in M(ansible.builtin.uri), this only restricts TLS 1.2 and older.
      type: list
      elements: str
    decompress:
      description:
        - Whether to attempt to decompress gzip content-encoded responses.
      type: bool
      default: true
    follow_redirects:
      description:
        - Whether or not the module should follow redirects.
        - V(all) will follow all redirects.
        - V(none) will not follow any redirects.
        - V(safe) will follow only "safe" redirects, where "safe" means that the client is only doing a C(GET) or C(HEAD)
          on the URI to which it is being redirected.
        - V(urllib2) will use the default behavior of Python's urllib2, which M(ansible.builtin.uri) uses.
        - V(no) and V(yes) are deprecated aliases of V(none) and V(all).
      type: str
      choices: [all, 'no', none, safe, urllib2, 'yes']
      default: safe
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
    - ansible.builtin.files
  attributes:
    check_mode:
      support: none
    diff_mode:
      support: none
    platform:
      platforms: posix
  notes:
    - The module returns all the HTTP headers in lower-case.
    - Async tasks need Python on the target, as Ansible's async wrapper is written in Python.
    - Response header values are reported without surrounding whitespace, where Python keeps trailing whitespace.
    - TLS error messages are Python's, without the C(_ssl.c) source location Python adds to them.
  seealso:
    - module: ansible.builtin.uri
  author:
    - Hugo (@hugonz)

EXAMPLES: |
  - name: Check that you can connect (GET) to a page and it returns a status 200
    compiled.builtin.uri:
      url: http://www.example.com

  - name: Check that a page returns successfully but fail if the word AWESOME is not in the page contents
    compiled.builtin.uri:
      url: http://www.example.com
      return_content: true
    register: this
    failed_when: this is failed or "'AWESOME' not in this.content"

  - name: Create a JIRA issue
    compiled.builtin.uri:
      url: https://your.jira.example.com/rest/api/2/issue/
      user: your_username
      password: your_pass
      method: POST
      body: "{{ lookup('ansible.builtin.file','issue.json') }}"
      force_basic_auth: true
      status_code: 201
      body_format: json

  - name: Login to a form based webpage, then use the returned cookie to access the app in later tasks
    compiled.builtin.uri:
      url: https://your.form.based.auth.example.com/index.php
      method: POST
      body_format: form-urlencoded
      body:
        name: your_username
        password: your_password
        enter: Sign in
      status_code: 302
    register: login

  - name: Upload a file with multipart/form-data
    compiled.builtin.uri:
      url: https://httpbin.org/post
      method: POST
      body_format: form-multipart
      body:
        file1:
          filename: /bin/true
          mime_type: application/octet-stream
        text_form_field: value

  - name: Download a file to a directory
    compiled.builtin.uri:
      url: https://www.example.com/some/file.tar.gz
      dest: /tmp/

RETURN:
  content:
    description: The response body content.
    returned: status not in status_code or return_content is true
    type: str
    sample: "{}"
  cookies:
    description: The cookie values placed in cookie jar.
    returned: on success
    type: dict
    sample: {"SESSIONID": "[SESSIONID]"}
  cookies_string:
    description: The value for future request Cookie headers.
    returned: on success
    type: str
    sample: "SESSIONID=[SESSIONID]"
  elapsed:
    description: The number of seconds that elapsed while performing the download.
    returned: on success
    type: int
    sample: 23
  msg:
    description: The HTTP message from the request.
    returned: always
    type: str
    sample: OK (unknown bytes)
  path:
    description: destination file/path
    returned: dest is defined
    type: str
    sample: /path/to/file.txt
  redirected:
    description: Whether the request was redirected.
    returned: on success
    type: bool
    sample: false
  status:
    description: The HTTP status code from the request.
    returned: always
    type: int
    sample: 200
  url:
    description: The actual URL used for the request.
    returned: always
    type: str
    sample: https://www.ansible.com/
