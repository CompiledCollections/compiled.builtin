DOCUMENTATION:
  module: fetch
  short_description: Fetch files from remote nodes
  description:
  - 'Compiled Go replacement for M(ansible.builtin.fetch), with the same options and results. It does not need Python on the target: checksums
    and become reads use M(compiled.builtin.stat) and M(compiled.builtin.slurp).'
  - This module works like M(ansible.builtin.copy), but in reverse.
  - It is used for fetching files from remote machines and storing them locally in a file tree, organized by hostname.
  - Files that already exist at O(dest) will be overwritten if they are different than the O(src).
  version_added: 1.0.0
  options:
    src:
      description:
      - The file on the remote system to fetch.
      - This I(must) be a file, not a directory.
      - Recursive fetching may be supported in a later release.
      required: true
    dest:
      description:
      - A directory to save the file into.
      - For example, if O(dest=/backup), then O(src=/etc/profile) on host C(host.example.com), would save the file into C(/backup/host.example.com/etc/profile).
        The host name is based on the inventory name.
      required: true
    fail_on_missing:
      description:
      - When set to V(true), the task will fail if the remote file cannot be read for any reason.
      - Prior to Ansible 2.5, setting this would only fail if the source file was missing.
      - The default was changed to V(true) in Ansible 2.5.
      type: bool
      default: true
    validate_checksum:
      description:
      - Verify that the source and destination checksums match after the files are fetched.
      type: bool
      default: true
    flat:
      description:
      - Allows you to override the default behavior of appending hostname/path/to/file to the destination.
      - If O(dest) ends with '/', it will use the basename of the source file, similar to the copy module.
      - This can be useful if working with a single host, or if retrieving files that are uniquely named per host.
      - If using multiple hosts with the same filename, the file will be overwritten for each host.
      type: bool
      default: false
  extends_documentation_fragment:
  - ansible.builtin.action_common_attributes
  - ansible.builtin.action_common_attributes.files
  - ansible.builtin.action_common_attributes.flow
  attributes:
    action:
      support: full
      description: Indicates this has a corresponding action plugin so some parts of the options can be executed on the controller.
    async:
      support: none
      description: Supports being used with the C(async) keyword.
    bypass_host_loop:
      support: none
      description: Forces a "global" task that does not execute per host.
    check_mode:
      support: full
      description: Can run in check_mode and return changed status prediction without modifying target.
    diff_mode:
      support: full
      description: Will return details on what has changed (or possibly needs changing in check_mode), when in diff mode.
    platform:
      platforms: posix
      description: Target OS/families that can be operated against.
    safe_file_operations:
      support: none
      description: Uses Ansible's mechanism to safely write files, keeping ownership, mode and SELinux context.
    vault:
      support: none
      description: Can automatically decrypt Ansible vaulted files.
  notes:
  - When running fetch with C(become), the M(ansible.builtin.slurp) module will also be used to fetch the contents of the file for determining
    the remote checksum. This effectively doubles the transfer size, and depending on the file size can consume all available memory on the remote
    or local hosts causing a C(MemoryError). Due to this it is advisable to run this module without C(become) whenever possible.
  - Prior to Ansible 2.5 this module would not fail if reading the remote file was impossible unless O(fail_on_missing) was set.
  - In Ansible 2.5 or later, playbook authors are encouraged to use C(fail_when) or C(ignore_errors) to get this ability. They may also explicitly
    set O(fail_on_missing) to V(false) to get the non-failing behaviour.
  seealso:
  - module: ansible.builtin.fetch
  - module: ansible.builtin.copy
  - module: ansible.builtin.slurp
  author:
  - Hugo (@hugonz)

EXAMPLES: |
  - name: Store file into /tmp/fetched/host.example.com/tmp/somefile
    compiled.builtin.fetch:
      src: /tmp/somefile
      dest: /tmp/fetched

  - name: Specifying a path directly
    compiled.builtin.fetch:
      src: /tmp/somefile
      dest: /tmp/prefix-{{ inventory_hostname }}
      flat: yes

  - name: Specifying a destination path
    compiled.builtin.fetch:
      src: /tmp/uniquefile
      dest: /tmp/special/
      flat: yes

  - name: Storing in a path relative to the playbook
    compiled.builtin.fetch:
      src: /tmp/uniquefile
      dest: special/prefix-{{ inventory_hostname }}
      flat: yes

RETURN: {}
