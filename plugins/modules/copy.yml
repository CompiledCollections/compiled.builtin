DOCUMENTATION:
  module: copy
  version_added: 1.0.0
  short_description: Copy files to remote locations
  description:
    - Compiled Go replacement for M(ansible.builtin.copy), with the same options and results. It does not need Python on the
      target.
    - The M(ansible.builtin.copy) module copies a file or a directory structure from the local or remote machine to a location
      on the remote machine. File system meta-information (permissions, ownership, etc.) may be set, even when the file or directory
      already exists on the target system. Some meta-information may be copied on request.
    - Get meta-information with the M(ansible.builtin.stat) module.
    - Set meta-information with the M(ansible.builtin.file) module.
    - Use the M(ansible.builtin.fetch) module to copy files from remote locations to the local box.
    - If you need variable interpolation in copied files, use the M(ansible.builtin.template) module. Using a variable with
      the O(content) parameter produces unpredictable results.
  options:
    src:
      description:
        - Local path to a file to copy to the remote server.
        - This can be absolute or relative.
        - If path is a directory, it is copied recursively. In this case, if path ends with C(/), only inside contents of that
          directory are copied to destination. Otherwise, if it does not end with C(/), the directory itself with all contents
          is copied. This behavior is similar to the C(rsync) command line tool.
      type: path
    content:
      description:
        - When used instead of O(src), sets the contents of a file directly to the specified value.
        - Works only when O(dest) is a file. Creates the file if it does not exist.
        - For advanced formatting or if O(content) contains a variable, use the M(ansible.builtin.template) module.
      type: str
    dest:
      description:
        - Remote absolute path where the file should be copied to.
        - If O(src) is a directory, this must be a directory too.
        - If O(dest) is a non-existent path and if either O(dest) ends with C(/) or O(src) is a directory, O(dest) is created.
        - If O(dest) is a relative path, the starting directory is determined by the remote host.
        - If O(src) and O(dest) are files, the parent directory of O(dest) is not created and the task fails if it does not
          already exist.
      type: path
      required: true
    backup:
      description:
        - Create a backup file including the timestamp information so you can get the original file back if you somehow clobbered
          it incorrectly.
      type: bool
      default: false
    force:
      description:
        - Influence whether the remote file must always be replaced.
        - If V(true), the remote file will be replaced when contents are different than the source.
        - If V(false), the file will only be transferred if the destination does not exist.
      type: bool
      default: true
    mode:
      description:
        - The permissions of the destination file or directory.
        - For those used to C(/usr/bin/chmod) remember that modes are actually octal numbers. You must either add a leading
          zero so that Ansible's YAML parser knows it is an octal number (like V(0644) or V(01777)) or quote it (like V('644')
          or V('1777')) so Ansible receives a string and can do its own conversion from string into number. Giving Ansible a
          number without following one of these rules will end up with a decimal number which will have unexpected results.
        - As of Ansible 1.8, the mode may be specified as a symbolic mode (for example, V(u+rwx) or V(u=rw,g=r,o=r)).
        - As of Ansible 2.3, the mode may also be the special string V(preserve).
        - V(preserve) means that the file will be given the same permissions as the source file.
        - When doing a recursive copy, see also O(directory_mode).
        - If O(mode) is not specified and the destination file B(does not) exist, the default C(umask) on the system will be
          used when setting the mode for the newly created file.
        - If O(mode) is not specified and the destination file B(does) exist, the mode of the existing file will be used.
        - Specifying O(mode) is the best way to ensure files are created with the correct permissions. See CVE-2020-1736 for
          further details.
    directory_mode:
      description:
        - Set the access permissions of newly created directories to the given mode. Permissions on existing directories do
          not change.
        - See O(mode) for the syntax of accepted values.
        - The target system's defaults determine permissions when this parameter is not set.
      type: raw
    remote_src:
      description:
        - Influence whether O(src) needs to be transferred or already is present remotely.
        - If V(false), it will search for O(src) on the controller node.
        - If V(true), it will search for O(src) on the managed (remote) node.
        - O(remote_src) supports recursive copying as of version 2.8.
        - O(remote_src) only works with O(mode=preserve) as of version 2.6.
        - Auto-decryption of files does not work when O(remote_src=yes).
      type: bool
      default: false
    follow:
      description:
        - This flag indicates that filesystem links in the destination, if they exist, should be followed.
      type: bool
      default: false
    local_follow:
      description:
        - This flag indicates that filesystem links in the source tree, if they exist, should be followed.
      type: bool
    checksum:
      description:
        - SHA1 checksum of the file being transferred.
        - Used to validate that the copy of the file was successful.
        - If this is not provided, ansible will use the local calculated checksum of the src file.
      type: str
  extends_documentation_fragment:
    - ansible.builtin.decrypt
    - ansible.builtin.files
    - ansible.builtin.validate
    - ansible.builtin.action_common_attributes
    - ansible.builtin.action_common_attributes.files
    - ansible.builtin.action_common_attributes.flow
  notes:
    - The M(ansible.builtin.copy) module recursively copy facility does not scale to lots (>hundreds) of files.
    - The transfer itself is done by the M(ansible.builtin.copy) action of the controller's ansible-core; on the target, the
      compiled copy, file, stat and slurp modules do the work of the Python ones.
  attributes:
    action:
      support: full
    async:
      support: none
    bypass_host_loop:
      support: none
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      platforms: posix
    safe_file_operations:
      description: Uses Ansible's mechanism to safely write files, keeping ownership, mode and SELinux context.
      support: full
    vault:
      description: Can automatically decrypt Ansible vaulted files.
      support: full
  seealso:
    - module: ansible.builtin.copy
    - module: compiled.builtin.file
    - module: compiled.builtin.stat
  author:
    - Hugo (@hugonz)

EXAMPLES: |
  - name: Copy file with owner and permissions
    compiled.builtin.copy:
      src: /srv/myfiles/foo.conf
      dest: /etc/foo.conf
      owner: foo
      group: foo
      mode: '0644'

  - name: Copy file with owner and permission, using symbolic representation
    compiled.builtin.copy:
      src: /srv/myfiles/foo.conf
      dest: /etc/foo.conf
      owner: foo
      group: foo
      mode: u=rw,g=r,o=r

  - name: Another symbolic mode example, adding some permissions and removing others
    compiled.builtin.copy:
      src: /srv/myfiles/foo.conf
      dest: /etc/foo.conf
      owner: foo
      group: foo
      mode: u+rw,g-wx,o-rwx

  - name: Copy a new "ntp.conf" file into place, backing up the original if it differs from the copied version
    compiled.builtin.copy:
      src: /mine/ntp.conf
      dest: /etc/ntp.conf
      owner: root
      group: root
      mode: '0644'
      backup: yes

  - name: Copy a new "sudoers" file into place, after passing validation with visudo
    compiled.builtin.copy:
      src: /mine/sudoers
      dest: /etc/sudoers
      validate: /usr/sbin/visudo -csf %s

  - name: Copy a "sudoers" file on the remote machine for editing
    compiled.builtin.copy:
      src: /etc/sudoers
      dest: /etc/sudoers.edit
      remote_src: yes
      validate: /usr/sbin/visudo -csf %s

  - name: Copy using inline content
    compiled.builtin.copy:
      content: '# This file was moved to /etc/other.conf'
      dest: /etc/mine.conf

  - name: If follow=yes, /path/to/file will be overwritten by contents of foo.conf
    compiled.builtin.copy:
      src: /etc/foo.conf
      dest: /path/to/link  # link to /path/to/file
      follow: yes

  - name: If follow=no, /path/to/link will become a file and be overwritten by contents of foo.conf
    compiled.builtin.copy:
      src: /etc/foo.conf
      dest: /path/to/link  # link to /path/to/file
      follow: no

RETURN:
  dest:
    description: Destination file/path.
    returned: success
    type: str
    sample: /path/to/file.txt
  src:
    description: Source file used for the copy on the target machine.
    returned: changed
    type: str
    sample: /home/httpd/.ansible/tmp/ansible-tmp-1423796390.97-147729857856000/source
  md5sum:
    description: MD5 checksum of the file after running copy.
    returned: when supported
    type: str
    sample: 2a5aeecc61dc98c4d780b14b330e3282
  checksum:
    description: SHA1 checksum of the file after running copy.
    returned: success
    type: str
    sample: 6e642bb8dd5c2e027bf21dd923337cbb4214f827
  backup_file:
    description: Name of backup file created.
    returned: changed and if backup=yes
    type: str
    sample: /path/to/file.txt.2015-02-12@22:09~
  gid:
    description: Group id of the file, after execution.
    returned: success
    type: int
    sample: 100
  group:
    description: Group of the file, after execution.
    returned: success
    type: str
    sample: httpd
  owner:
    description: Owner of the file, after execution.
    returned: success
    type: str
    sample: httpd
  uid:
    description: Owner id of the file, after execution.
    returned: success
    type: int
    sample: 100
  mode:
    description: Permissions of the target, after execution.
    returned: success
    type: str
    sample: '0644'
  size:
    description: Size of the target, after execution.
    returned: success
    type: int
    sample: 1220
  state:
    description: State of the target, after execution.
    returned: success
    type: str
    sample: file
