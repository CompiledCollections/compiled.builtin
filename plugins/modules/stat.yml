DOCUMENTATION:
  module: stat
  version_added: 1.0.0
  short_description: Retrieve file or file system status
  description:
  - Compiled Go replacement for M(ansible.builtin.stat), with the same options and results. It does not need Python on the
    target.
  - Retrieves facts for a file similar to the Linux/Unix C(stat) command.
  - For Windows targets, use the M(ansible.windows.win_stat) module instead.
  options:
    path:
      description:
      - The full path of the file/object to get the facts of.
      type: path
      required: true
      aliases:
      - dest
      - name
    follow:
      description:
      - Whether to follow symlinks.
      type: bool
      default: false
    get_mime:
      description:
      - Use file magic and return data about the nature of the file. This uses the C(file) utility found on most Linux/Unix
        systems.
      - This will add both RV(stat.mimetype) and RV(stat.charset) fields to the return, if possible.
      - In Ansible 2.3 this option changed from O(mime) to O(get_mime) and the default changed to V(true).
      type: bool
      default: true
      aliases:
      - mime
      - mime_type
      - mime-type
    get_attributes:
      description:
      - Get file attributes using lsattr tool if present.
      type: bool
      default: true
      aliases:
      - attr
      - attributes
    get_checksum:
      description:
      - Whether to return a checksum of the file.
      type: bool
      default: true
    checksum_algorithm:
      description:
      - Algorithm to determine checksum of file.
      - Will throw an error if the host is unable to use specified algorithm.
      - The remote host has to support the hashing method specified, V(md5) can be unavailable if the host is FIPS-140
        compliant.
      - Availability might be restricted by the target system, for example FIPS systems won't allow md5 use.
      type: str
      choices: [md5, sha1, sha224, sha256, sha384, sha512]
      default: sha1
      aliases: [checksum, checksum_algo]
    get_selinux_context:
      description:
      - Get file SELinux context in a list V([user, role, type, range]), and will get V([None, None, None, None]) if it is
        not possible to retrieve the context, either because it does not exist or some other issue.
      type: bool
      default: false
  extends_documentation_fragment:
  - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: none
    platform:
      platforms: posix
  seealso:
  - module: ansible.builtin.stat
  - module: ansible.builtin.file
  author:
  - Hugo (@hugonz)
  notes:
  - C(mimetype) and C(charset) come from the C(file) command on the target, and C(attributes) from C(lsattr), as for M(ansible.builtin.stat).

EXAMPLES: |
  # Obtain the stats of /etc/foo.conf, and check that the file still belongs
  # to 'root'. Fail otherwise.
  - name: Get stats of a file
    compiled.builtin.stat:
      path: /etc/foo.conf
    register: st
  - name: Fail if the file does not belong to 'root'
    ansible.builtin.fail:
      msg: "Whoops! file ownership has changed"
    when: st.stat.pw_name != 'root'

  # Determine if a path exists and is a symlink. Note that if the path does
  # not exist, and we test sym.stat.islnk, it will fail with an error. So
  # therefore, we must test whether it is defined.
  # Run this to understand the structure, the skipped ones do not pass the
  # check performed by 'when'
  - name: Get stats of the FS object
    compiled.builtin.stat:
      path: /path/to/something
    register: sym

  - name: Print a debug message
    ansible.builtin.debug:
      msg: "islnk isn't defined (path doesn't exist)"
    when: sym.stat.islnk is not defined

  - name: Print a debug message
    ansible.builtin.debug:
      msg: "islnk is defined (path must exist)"
    when: sym.stat.islnk is defined

  - name: Print a debug message
    ansible.builtin.debug:
      msg: "Path exists and is a symlink"
    when: sym.stat.islnk is defined and sym.stat.islnk

  - name: Print a debug message
    ansible.builtin.debug:
      msg: "Path exists and isn't a symlink"
    when: sym.stat.islnk is defined and sym.stat.islnk == False


  # Determine if a path exists and is a directory.  Note that we need to test
  # both that p.stat.isdir actually exists, and also that it's set to true.
  - name: Get stats of the FS object
    compiled.builtin.stat:
      path: /path/to/something
    register: p
  - name: Print a debug message
    ansible.builtin.debug:
      msg: "Path exists and is a directory"
    when: p.stat.isdir is defined and p.stat.isdir

  - name: Do not calculate the checksum
    compiled.builtin.stat:
      path: /path/to/myhugefile
      get_checksum: no

  - name: Use sha256 to calculate the checksum
    compiled.builtin.stat:
      path: /path/to/something
      checksum_algorithm: sha256

RETURN:
  stat:
    description: Dictionary containing all the stat data, some platforms might add additional fields.
    returned: success
    type: dict
    contains:
      exists:
        description: If the destination path actually exists or not
        returned: success
        type: bool
        sample: true
      path:
        description: The full path of the file/object to get the facts of
        returned: success and if path exists
        type: str
        sample: /path/to/file
      mode:
        description: Unix permissions of the file in octal representation as a string
        returned: success, path exists and user can read stats
        type: str
        sample: 1755
      isdir:
        description: Tells you if the path is a directory
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      ischr:
        description: Tells you if the path is a character device
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      isblk:
        description: Tells you if the path is a block device
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      isreg:
        description: Tells you if the path is a regular file
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      isfifo:
        description: Tells you if the path is a named pipe
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      islnk:
        description: Tells you if the path is a symbolic link
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      issock:
        description: Tells you if the path is a unix domain socket
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      uid:
        description: Numeric id representing the file owner
        returned: success, path exists and user can read stats
        type: int
        sample: 1003
      gid:
        description: Numeric id representing the group of the owner
        returned: success, path exists and user can read stats
        type: int
        sample: 1003
      size:
        description: Size in bytes for a plain file, amount of data for some special files
        returned: success, path exists and user can read stats
        type: int
        sample: 203
      inode:
        description: Inode number of the path
        returned: success, path exists and user can read stats
        type: int
        sample: 12758
      dev:
        description: Device the inode resides on
        returned: success, path exists and user can read stats
        type: int
        sample: 33
      nlink:
        description: Number of links to the inode (hard links)
        returned: success, path exists and user can read stats
        type: int
        sample: 1
      atime:
        description: Time of last access
        returned: success, path exists and user can read stats
        type: float
        sample: 1424348972.575
      mtime:
        description: Time of last modification
        returned: success, path exists and user can read stats
        type: float
        sample: 1424348972.575
      ctime:
        description: Time of last metadata update or creation (depends on OS)
        returned: success, path exists and user can read stats
        type: float
        sample: 1424348972.575
      wusr:
        description: Tells you if the owner has write permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      rusr:
        description: Tells you if the owner has read permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      xusr:
        description: Tells you if the owner has execute permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      wgrp:
        description: Tells you if the owner's group has write permission
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      rgrp:
        description: Tells you if the owner's group has read permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      xgrp:
        description: Tells you if the owner's group has execute permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      woth:
        description: Tells you if others have write permission
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      roth:
        description: Tells you if others have read permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      xoth:
        description: Tells you if others have execute permission
        returned: success, path exists and user can read stats
        type: bool
        sample: true
      isuid:
        description: Tells you if the invoking user's id matches the owner's id
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      isgid:
        description: Tells you if the invoking user's group id matches the owner's group id
        returned: success, path exists and user can read stats
        type: bool
        sample: false
      lnk_source:
        description: Target of the symlink normalized for the remote filesystem
        returned: success, path exists and user can read stats and the path is a symbolic link
        type: str
        sample: /home/foobar/21102015-1445431274-908472971
      lnk_target:
        description: Target of the symlink.  Note that relative paths remain relative
        returned: success, path exists and user can read stats and the path is a symbolic link
        type: str
        sample: ../foobar/21102015-1445431274-908472971
      checksum:
        description: hash of the file
        returned: success, path exists, user can read stats, path supports hashing and supplied checksum algorithm is available
        type: str
        sample: 50ba294cdf28c0d5bcde25708df53346825a429f
      pw_name:
        description: User name of owner
        returned: success, path exists, user can read stats, owner name can be looked up and installed python supports it
        type: str
        sample: httpd
      gr_name:
        description: Group name of owner
        returned: success, path exists, user can read stats, owner group can be looked up and installed python supports it
        type: str
        sample: www-data
      mimetype:
        description: file magic data or mime-type
        returned: success, path exists and user can read stats and installed python supports it and the O(get_mime) option
          was V(true), will return V(unknown) on error.
        type: str
        sample: application/pdf; charset=binary
      charset:
        description: file character set or encoding
        returned: success, path exists and user can read stats and installed python supports it and the O(get_mime) option
          was V(true), will return V(unknown) on error.
        type: str
        sample: us-ascii
      readable:
        description: Tells you if the invoking user has the right to read the path
        returned: success, path exists and user can read the path
        type: bool
        sample: false
      writeable:
        description: Tells you if the invoking user has the right to write the path
        returned: success, path exists and user can write the path
        type: bool
        sample: false
      executable:
        description: Tells you if the invoking user has execute permission on the path
        returned: success, path exists and user can execute the path
        type: bool
        sample: false
      attributes:
        description: list of file attributes
        returned: success, path exists and user can execute the path
        type: list
        sample:
        - immutable
        - extent
      selinux_context:
        description: The SELinux context of a path
        returned: success, path exists and user can execute the path
        type: list
        sample:
        - user
        - role
        - type
        - range
      version:
        description: The version/generation attribute of a file according to the filesystem
        returned: success, path exists, user can execute the path, lsattr is available and filesystem supports
        type: str
        sample: '381700746'
      disk_usage_bytes:
        description: The disk usage of a path in bytes
        returned: success, path exists, user can execute the path, filesystem supports st_blocks
        type: int
        sample: 1024
