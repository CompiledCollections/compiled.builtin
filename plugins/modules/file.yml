DOCUMENTATION:
  module: file
  version_added: 1.0.0
  short_description: Manage files and file properties
  description:
    - Compiled Go replacement for M(ansible.builtin.file), with the same options and results. It does not need Python on the
      target.
    - Set attributes of files, directories, or symlinks and their targets.
    - Alternatively, remove files, symlinks or directories.
    - Many other modules support the same options as the M(ansible.builtin.file) module - including M(ansible.builtin.copy),
      M(ansible.builtin.template), and M(ansible.builtin.assemble).
  options:
    path:
      description:
        - Path to the file being managed.
      type: path
      required: true
      aliases:
        - dest
        - name
    state:
      description:
        - If V(absent), directories will be recursively deleted, and files or symlinks will be unlinked. In the case of a directory,
          if C(diff) is declared, you will see the files and folders deleted listed under C(path_contents). Note that V(absent)
          will not cause M(ansible.builtin.file) to fail if the O(path) does not exist as the state did not change.
        - If V(directory), all intermediate subdirectories will be created if they do not exist. Since Ansible 1.7 they will
          be created with the supplied permissions.
        - If V(file), with no other options, returns the current state of C(path).
        - If V(file), even with other options (such as O(mode)), the file will be modified if it exists but will NOT be created
          if it does not exist. Set to V(touch) or use the M(ansible.builtin.copy) or M(ansible.builtin.template) module if
          you want to create the file if it does not exist.
        - If V(hard), the hard link will be created or changed.
        - If V(link), the symbolic link will be created or changed.
        - If V(touch) (new in 1.4), an empty file will be created if the file does not exist, while an existing file or directory
          will receive updated file access and modification times (similar to the way V(touch) works from the command line).
        - Default is the current state of the file if it exists, V(directory) if O(recurse=yes), or V(file) otherwise.
      type: str
      choices:
        - absent
        - directory
        - file
        - hard
        - link
        - touch
    src:
      description:
        - Path of the file to link to.
        - This applies only to O(state=link) and O(state=hard).
        - For O(state=link), this will also accept a non-existing path.
        - Relative paths are relative to the file being created (O(path)) which is how the Unix command C(ln -s SRC DEST) treats
          relative paths.
      type: path
    recurse:
      description:
        - Recursively set the specified file attributes on directory contents.
        - This applies only when O(state) is set to V(directory).
      type: bool
      default: false
    force:
      description:
        - 'Force the creation of the links in two cases: if the link type is symbolic and the source file does not exist (but
          will appear later); the destination exists and is a file (so, we need to unlink the O(path) file and create a link
          to the O(src) file in place of it).

          '
      type: bool
      default: false
    follow:
      description:
        - This flag indicates that filesystem links, if they exist, should be followed.
        - O(follow=yes) and O(state=link) can modify O(src) when combined with parameters such as O(mode).
        - Previous to Ansible 2.5, this was V(false) by default.
        - While creating a symlink with a non-existent destination, set O(follow=false) to avoid a warning message related to
          permission issues. The warning message is added to notify the user that we can not set permissions to the non-existent
          destination.
      type: bool
      default: true
    modification_time:
      description:
        - This parameter indicates the time the file's modification time should be set to.
        - Should be V(preserve) when no modification is required, C(YYYYMMDDHHMM.SS) when using default time format, or V(now).
        - Default is None meaning that V(preserve) is the default for O(state=[file,directory,link,hard]) and V(now) is default
          for O(state=touch).
      type: str
    modification_time_format:
      description:
        - When used with O(modification_time), indicates the time format that must be used.
        - Based on default Python format (see time.strftime doc).
      type: str
      default: '%Y%m%d%H%M.%S'
    access_time:
      description:
        - This parameter indicates the time the file's access time should be set to.
        - Should be V(preserve) when no modification is required, C(YYYYMMDDHHMM.SS) when using default time format, or V(now).
        - Default is V(None) meaning that V(preserve) is the default for O(state=[file,directory,link,hard]) and V(now) is default
          for O(state=touch).
      type: str
    access_time_format:
      description:
        - When used with O(access_time), indicates the time format that must be used.
        - Based on default Python format (see time.strftime doc).
      type: str
      default: '%Y%m%d%H%M.%S'
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
    - ansible.builtin.action_common_attributes.files
    - ansible.builtin.files
  attributes:
    check_mode:
      support: full
    diff_mode:
      details: permissions and ownership will be shown but file contents on absent/touch will not.
      support: partial
    platform:
      platforms: posix
  seealso:
    - module: ansible.builtin.file
    - module: compiled.builtin.stat
    - module: ansible.builtin.copy
  author:
    - Hugo (@hugonz)

EXAMPLES: |
  - name: Change file ownership, group and permissions
    compiled.builtin.file:
      path: /etc/foo.conf
      owner: foo
      group: foo
      mode: '0644'

  - name: Change file group using gid
    compiled.builtin.file:
      path: /etc/bar.conf
      group: "1000"

  - name: Give insecure permissions to an existing file
    compiled.builtin.file:
      path: /work
      owner: root
      group: root
      mode: '1777'

  - name: Create a symbolic link
    compiled.builtin.file:
      src: /file/to/link/to
      dest: /path/to/symlink
      owner: foo
      group: foo
      state: link

  - name: Create two hard links
    compiled.builtin.file:
      src: '/tmp/{{ item.src }}'
      dest: '{{ item.dest }}'
      state: hard
    loop:
      - { src: x, dest: y }
      - { src: z, dest: k }

  - name: Touch a file, using symbolic modes to set the permissions (equivalent to 0644)
    compiled.builtin.file:
      path: /etc/foo.conf
      state: touch
      mode: u=rw,g=r,o=r

  - name: Touch the same file, but add/remove some permissions
    compiled.builtin.file:
      path: /etc/foo.conf
      state: touch
      mode: u+rw,g-wx,o-rwx

  - name: Touch again the same file, but do not change times this makes the task idempotent
    compiled.builtin.file:
      path: /etc/foo.conf
      state: touch
      mode: u+rw,g-wx,o-rwx
      modification_time: preserve
      access_time: preserve

  - name: Create a directory if it does not exist
    compiled.builtin.file:
      path: /etc/some_directory
      state: directory
      mode: '0755'

  - name: Update modification and access time of given file
    compiled.builtin.file:
      path: /etc/some_file
      state: file
      modification_time: now
      access_time: now

  - name: Set access time based on seconds from epoch value
    compiled.builtin.file:
      path: /etc/another_file
      state: file
      access_time: '{{ "%Y%m%d%H%M.%S" | strftime(stat_var.stat.atime) }}'

  - name: Recursively change ownership of a directory
    compiled.builtin.file:
      path: /etc/foo
      state: directory
      recurse: yes
      owner: foo
      group: foo

  - name: Remove file (delete file)
    compiled.builtin.file:
      path: /etc/foo.txt
      state: absent

  - name: Recursively remove directory
    compiled.builtin.file:
      path: /etc/foo
      state: absent

RETURN:
  dest:
    description: Destination file/path, equal to the value passed to O(path).
    returned: O(state=touch), O(state=hard), O(state=link)
    type: str
    sample: /path/to/file.txt
  path:
    description: Destination file/path, equal to the value passed to O(path).
    returned: O(state=absent), O(state=directory), O(state=file)
    type: str
    sample: /path/to/file.txt
