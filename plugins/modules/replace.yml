DOCUMENTATION:
  module: replace
  short_description: Replace all instances of a particular string in a file using a back-referenced regular expression
  description:
  - Compiled Go replacement for M(ansible.builtin.replace), with the same options and results. It does not need Python on the target.
  - This module will replace all instances of a pattern within a file.
  - It is up to the user to maintain idempotence by ensuring that the same pattern would never match any replacements made.
  version_added: 1.0.0
  options:
    path:
      description:
      - The file to modify.
      - Before Ansible 2.3 this option was only usable as O(dest), O(destfile) and O(name).
      type: path
      required: true
      aliases:
      - dest
      - destfile
      - name
    regexp:
      description:
      - The regular expression to look for in the contents of the file.
      - Uses Python regular expressions; see U(https://docs.python.org/3/library/re.html).
      - Uses Python regular expression syntax, run by Go's RE2 engine. Unicode classes, C($), C(\Z) and escapes behave as in Python.
        Lookahead and lookbehind assertions, backreferences inside the pattern, conditional groups and verbose mode are not available
        and make the task fail.
      - Uses MULTILINE mode, which means V(^) and V($) match the beginning and end of the file, as well as the beginning and end respectively
        of I(each line) of the file.
      - Does not use DOTALL, which means the V(.) special character matches any character I(except newlines). A common mistake is to assume that
        a negated character set like V([^#]) will also not match newlines.
      - In order to exclude newlines, they must be added to the set like V([^#\\n]).
      - Note that, as of Ansible 2.0, short form tasks should have any escape sequences backslash-escaped in order to prevent them being parsed
        as string literal escapes. See the examples.
      type: str
      required: true
    replace:
      description:
      - The string to replace regexp matches.
      - May contain backreferences that will get expanded with the regexp capture groups if the regexp matches.
      - If not set, matches are removed entirely.
      - Backreferences can be used ambiguously like V(\\1), or explicitly like V(\\g<1>).
      type: str
      default: ''
    after:
      description:
      - If specified, only content after this match will be replaced/removed.
      - Can be used in combination with O(before).
      - Uses Python regular expressions; see U(https://docs.python.org/3/library/re.html).
      - Uses Python regular expression syntax, run by Go's RE2 engine. Unicode classes, C($), C(\Z) and escapes behave as in Python.
        Lookahead and lookbehind assertions, backreferences inside the pattern, conditional groups and verbose mode are not available
        and make the task fail.
      - Uses DOTALL, which means the V(.) special character I(can match newlines).
      - Does not use MULTILINE, so V(^) and V($) will only match the beginning and end of the file.
      type: str
    before:
      description:
      - If specified, only content before this match will be replaced/removed.
      - Can be used in combination with O(after).
      - Uses Python regular expressions; see U(https://docs.python.org/3/library/re.html).
      - Uses Python regular expression syntax, run by Go's RE2 engine. Unicode classes, C($), C(\Z) and escapes behave as in Python.
        Lookahead and lookbehind assertions, backreferences inside the pattern, conditional groups and verbose mode are not available
        and make the task fail.
      - Uses DOTALL, which means the V(.) special character I(can match newlines).
      - Does not use MULTILINE, so V(^) and V($) will only match the beginning and end of the file.
      type: str
    backup:
      description:
      - Create a backup file including the timestamp information so you can get the original file back if you somehow clobbered it incorrectly.
      type: bool
      default: false
    encoding:
      description:
      - The character encoding for reading and writing the file.
      - Supported are UTF-8 (with or without a BOM), ASCII, Latin-1, Windows-1252, UTF-16 and UTF-32.
      type: str
      default: utf-8
  extends_documentation_fragment:
  - ansible.builtin.action_common_attributes
  - ansible.builtin.action_common_attributes.files
  - ansible.builtin.files
  - ansible.builtin.validate
  attributes:
    check_mode:
      support: full
      description: Can run in check_mode and return changed status prediction without modifying target.
    diff_mode:
      support: full
      description: Will return details on what has changed (or possibly needs changing in check_mode), when in diff mode.
    platform:
      platforms: posix
      description: Target OS/families that can be operated against.
    safe_file_operations:
      support: full
      description: Uses Ansible's mechanism to safely write files, keeping ownership, mode and SELinux context.
    vault:
      support: none
      description: Can automatically decrypt Ansible vaulted files.
  notes:
  - As of Ansible 2.3, the O(dest) option has been changed to O(path) as default, but O(dest) still works as well.
  - As of Ansible 2.7.10, the combined use of O(before) and O(after) works properly. If you were relying on the previous incorrect behavior, you
    may be need to adjust your tasks. See U(https://github.com/ansible/ansible/issues/31354) for details.
  - Option O(ignore:follow) has been removed in Ansible 2.5, because this module modifies the contents of the file so O(ignore:follow=no) does
    not make sense.
  - SELinux contexts are read and set through extended attributes; default contexts (V(_default)) need C(matchpathcon) on the target.
  - File attributes need C(lsattr) and C(chattr) on the target, as for M(ansible.builtin.replace).
  seealso:
  - module: ansible.builtin.replace
  author:
  - Hugo (@hugonz)

EXAMPLES: |
  - name: Replace old hostname with new hostname (requires Ansible >= 2.4)
    compiled.builtin.replace:
      path: /etc/hosts
      regexp: '(\s+)old\.host\.name(\s+.*)?$'
      replace: '\1new.host.name\2'

  - name: Replace after the expression till the end of the file (requires Ansible >= 2.4)
    compiled.builtin.replace:
      path: /etc/apache2/sites-available/default.conf
      after: 'NameVirtualHost [*]'
      regexp: '^(.+)$'
      replace: '# \1'

  - name: Replace before the expression from the beginning of the file (requires Ansible >= 2.4)
    compiled.builtin.replace:
      path: /etc/apache2/sites-available/default.conf
      before: '# live site config'
      regexp: '^(.+)$'
      replace: '# \1'

  # Prior to Ansible 2.7.10, using before and after in combination did the opposite of what was intended.
  # see https://github.com/ansible/ansible/issues/31354 for details.
  # Note (?m) which turns on MULTILINE mode so ^ matches any line's beginning
  - name: Replace between the expressions (requires Ansible >= 2.4)
    compiled.builtin.replace:
      path: /etc/hosts
      after: '(?m)^<VirtualHost [*]>'
      before: '</VirtualHost>'
      regexp: '^(.+)$'
      replace: '# \1'

  - name: Supports common file attributes
    compiled.builtin.replace:
      path: /home/jdoe/.ssh/known_hosts
      regexp: '^old\.host\.name[^\n]*\n'
      owner: jdoe
      group: jdoe
      mode: '0644'

  - name: Supports a validate command
    compiled.builtin.replace:
      path: /etc/apache/ports
      regexp: '^(NameVirtualHost|Listen)\s+80\s*$'
      replace: '\1 127.0.0.1:8080'
      validate: '/usr/sbin/apache2ctl -f %s -t'

  - name: Short form task (in ansible 2+) necessitates backslash-escaped sequences
    compiled.builtin.replace: path=/etc/hosts regexp='\\b(localhost)(\\d*)\\b' replace='\\1\\2.localdomain\\2 \\1\\2'

  - name: Long form task does not
    compiled.builtin.replace:
      path: /etc/hosts
      regexp: '\b(localhost)(\d*)\b'
      replace: '\1\2.localdomain\2 \1\2'

  - name: Explicitly specifying positional matched groups in replacement
    compiled.builtin.replace:
      path: /etc/ssh/sshd_config
      regexp: '^(ListenAddress[ ]+)[^\n]+$'
      replace: '\g<1>0.0.0.0'

  - name: Explicitly specifying named matched groups
    compiled.builtin.replace:
      path: /etc/ssh/sshd_config
      regexp: '^(?P<dctv>ListenAddress[ ]+)(?P<host>[^\n]+)$'
      replace: '#\g<dctv>\g<host>\n\g<dctv>0.0.0.0'

RETURN: {}
