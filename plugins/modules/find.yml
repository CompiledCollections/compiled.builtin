DOCUMENTATION:
  module: find
  short_description: Return a list of files based on specific criteria
  description:
  - Compiled Go replacement for M(ansible.builtin.find), with the same options and results. It does not need Python on the target.
  - Return a list of files based on specific criteria. Multiple criteria are AND'd together.
  - This module does not use the C(find) command. It is intended for small and simple uses.
    Those that need the extra power or speed and have expertise with the UNIX command, should use it directly.
  version_added: 1.0.0
  options:
    age:
      description:
      - Select files whose age is equal to or greater than the specified time.
      - Use a negative age to find files equal to or less than the specified time.
      - You can choose seconds, minutes, hours, days, or weeks by specifying the first letter of any of those words (for example V(1w)).
      type: str
    get_checksum:
      description:
      - Whether to return a checksum of the file.
      type: bool
      default: false
    checksum_algorithm:
      description:
      - Algorithm to determine checksum of file.
      - Will throw an error if the host is unable to use specified algorithm.
      type: str
      choices: [md5, sha1, sha224, sha256, sha384, sha512]
      default: sha1
      aliases: [checksum, checksum_algo]
    patterns:
      default: []
      description:
      - One or more (shell or regex) patterns, which type is controlled by O(use_regex) option.
      - The patterns restrict the list of files to be returned to those whose base names match at least one of the patterns specified. Multiple
        patterns can be specified using a list.
      - The pattern is matched against the file base name, excluding the directory.
      - When using regular expressions, the pattern B(MUST) match the B(ENTIRE) file name, not just parts of it. So if you are looking to match
        all files ending in C(.default), you need to use V(.*\\.default) as a regexp and not just V(\\.default).
      - This parameter expects a list, which can be either comma separated or YAML. If any of the patterns contain a comma, make sure to put them
        in a list to avoid splitting the patterns in undesirable ways.
      - Defaults to V(*) when O(use_regex=false), or V(.*) when O(use_regex=true).
      type: list
      aliases:
      - pattern
      elements: str
    excludes:
      description:
      - One or more (shell or regex) patterns, which type is controlled by O(use_regex) option.
      - Items whose base names match an O(excludes) pattern are culled from O(patterns) matches. Multiple patterns can be specified using a list.
      type: list
      aliases:
      - exclude
      elements: str
    contains:
      description:
      - A regular expression or pattern which should be matched against the file content.
      - If O(read_whole_file=false) it matches against the beginning of the line (uses C(re.match(\))). If O(read_whole_file=true), it searches
        anywhere for that pattern (uses C(re.search(\))).
      - Works only when O(file_type) is V(file).
      - Uses the same regular expression syntax as O(use_regex) patterns.
      type: str
    read_whole_file:
      description:
      - When doing a O(contains) search, determines whether the whole file should be read into memory or if the regex should be applied to the
        file line-by-line.
      - Setting this to V(true) can have performance and memory implications for large files.
      - This uses C(re.search(\)) instead of C(re.match(\)).
      type: bool
      default: false
    paths:
      description:
      - List of paths of directories to search. All paths must be fully qualified.
      - From ansible-core 2.18 and onwards, the data type has changed from C(str) to C(path).
      type: list
      required: true
      aliases:
      - name
      - path
      elements: path
    file_type:
      description:
      - Type of file to select.
      - The V(link) and V(any) choices were added in Ansible 2.3.
      type: str
      choices:
      - any
      - directory
      - file
      - link
      default: file
    recurse:
      description:
      - If target is a directory, recursively descend into the directory looking for files.
      type: bool
      default: false
    size:
      description:
      - Select files whose size is equal to or greater than the specified size.
      - Use a negative size to find files equal to or less than the specified size.
      - Unqualified values are in bytes but V(b), V(k), V(m), V(g), and V(t) can be appended to specify bytes, kilobytes, megabytes, gigabytes,
        and terabytes, respectively.
      - Size is not evaluated for directories.
      type: str
    age_stamp:
      description:
      - Choose the file property against which we compare age.
      type: str
      choices:
      - atime
      - ctime
      - mtime
      default: mtime
    hidden:
      description:
      - Set this to V(true) to include hidden files, otherwise they are ignored.
      type: bool
      default: false
    mode:
      description:
      - Choose objects matching a specified permission. This value is restricted to modes that can be applied using the python C(os.chmod(\))
        function.
      - The mode can be provided as an octal such as V("0644") or as symbolic such as V(u=rw,g=r,o=r).
      type: raw
    exact_mode:
      description:
      - Restrict mode matching to exact matches only, and not as a minimum set of permissions to match.
      type: bool
      default: true
    follow:
      description:
      - Set this to V(true) to follow symlinks in path.
      type: bool
      default: false
    use_regex:
      description:
      - If V(false), the patterns are file globs (shell).
      - If V(true), they are Python regular expressions, run by Go's RE2 engine. Unicode classes, C($), C(\Z) and escapes behave as in Python.
        Lookahead and lookbehind assertions, backreferences inside the pattern, conditional groups and verbose mode are not available
        and make the task fail.
      type: bool
      default: false
    depth:
      description:
      - Set the maximum number of levels to descend into.
      - Setting O(recurse=false) is effectively O(depth=1) and overrides this value.
      - Default is unlimited depth.
      type: int
    encoding:
      description:
      - When doing a O(contains) search, determine the encoding of the files to be searched.
      - When no value is provided, UTF-8 is used, which is what Python uses under Ansible.
      - Supported are UTF-8 (with or without a BOM), ASCII, Latin-1, Windows-1252, UTF-16 and UTF-32.
      type: str
    limit:
      description:
      - Limit the maximum number of matching paths returned. After finding this many, the find action stops looking.
      - Matches are made from the top, down (meaning the shallowest directory first).
      - If not set, or set to V(null), it performs unlimited matches.
      - Default is unlimited matches.
      type: int
  extends_documentation_fragment:
  - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      details: since this action does not modify the target it just executes normally during check mode
      support: full
      description: Can run in check_mode and return changed status prediction without modifying target.
    diff_mode:
      support: none
      description: Will return details on what has changed (or possibly needs changing in check_mode), when in diff mode.
    platform:
      platforms: posix
      description: Target OS/families that can be operated against.
  seealso:
  - module: ansible.builtin.find
  - module: ansible.windows.win_find
  author:
  - Hugo (@hugonz)

EXAMPLES: |
  - name: Recursively find /tmp files older than 2 days
    compiled.builtin.find:
      paths: /tmp
      age: 2d
      recurse: yes

  - name: Recursively find /tmp files older than 4 weeks and equal or greater than 1 megabyte
    compiled.builtin.find:
      paths: /tmp
      age: 4w
      size: 1m
      recurse: yes

  - name: Recursively find /var/tmp files with last access time greater than 3600 seconds
    compiled.builtin.find:
      paths: /var/tmp
      age: 3600
      age_stamp: atime
      recurse: yes

  - name: Find /var/log files equal or greater than 10 megabytes ending with .old or .log.gz
    compiled.builtin.find:
      paths: /var/log
      patterns: '*.old,*.log.gz'
      size: 10m

  # Note that YAML double quotes require escaping backslashes but yaml single quotes do not.
  - name: Find /var/log files equal or greater than 10 megabytes ending with .old or .log.gz via regex
    compiled.builtin.find:
      paths: /var/log
      patterns: "^.*?\\.(?:old|log\\.gz)$"
      size: 10m
      use_regex: yes

  - name: Find /var/log all directories, exclude nginx and mysql
    compiled.builtin.find:
      paths: /var/log
      recurse: no
      file_type: directory
      excludes: 'nginx,mysql'

  # When using patterns that contain a comma, make sure they are formatted as lists to avoid splitting the pattern
  - name: Use a single pattern that contains a comma formatted as a list
    compiled.builtin.find:
      paths: /var/log
      file_type: file
      use_regex: yes
      patterns: ['^_[0-9]{2,4}_.*.log$']

  - name: Use multiple patterns that contain a comma formatted as a YAML list
    compiled.builtin.find:
      paths: /var/log
      file_type: file
      use_regex: yes
      patterns:
        - '^_[0-9]{2,4}_.*.log$'
        - '^[a-z]{1,5}_.*log$'

  - name: Find file containing "wally" without necessarily reading all files
    compiled.builtin.find:
      paths: /var/log
      file_type: file
      contains: wally
      read_whole_file: true
      patterns: "^.*\\.log$"
      use_regex: true
      recurse: true
      limit: 1

RETURN:
  files:
    description: All matches found with the specified criteria (see stat module for full output of each dictionary)
    returned: success
    type: list
    sample:
    - path: /var/tmp/test1
      mode: '0644'
      '...': '...'
      checksum: 16fac7be61a6e4591a33ef4b729c5c3302307523
    - path: /var/tmp/test2
      '...': '...'
  matched:
    description: Number of matches
    returned: success
    type: int
    sample: 14
  examined:
    description: Number of filesystem objects looked at
    returned: success
    type: int
    sample: 34
  skipped_paths:
    description: skipped paths and reasons they were skipped
    returned: success
    type: dict
    sample:
      /laskdfj: '''/laskdfj'' is not a directory'
