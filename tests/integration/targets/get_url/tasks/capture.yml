# Every file left in dest_dir: type, permissions and content, with backup
# names normalized.
- name: List the files
  ansible.builtin.shell: |
    cd "{{ dest_dir }}" || exit 0
    find . -mindepth 1 | sort | while read -r f; do
      if [ -d "$f" ]; then echo "$f dir $(stat -c '%a' "$f")"
      else echo "$f file $(stat -c '%a' "$f") $(base64 -w0 < "$f")"
      fi
    done | sed -E 's/\.[0-9]+\.[0-9]{4}-[0-9]{2}-[0-9]{2}@[0-9:]{8}~/.BACKUP~/'
    ls -A "{{ gu_dir }}/tmp"
  register: captured
  changed_when: false
