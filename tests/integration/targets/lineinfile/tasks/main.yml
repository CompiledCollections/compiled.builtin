- name: Compare compiled.builtin.lineinfile with ansible.builtin.lineinfile
  ansible.builtin.include_tasks: compare.yml
  loop: "{{ lineinfile_cases }}"
  loop_control:
    loop_var: case
    label: "{{ case.name }}"

- name: Regular expressions RE2 can't run fail clearly
  ansible.builtin.include_tasks: unsupported_regexp.yml
