- name: Files for the cases
  ansible.builtin.shell: |
    rm -rf "{{ shell_dir }}" && mkdir -p "{{ shell_dir }}" && cd "{{ shell_dir }}"
    echo x > exists.txt
    touch one.glob two.glob

- name: Compare compiled.builtin.shell with ansible.builtin.shell
  ansible.builtin.include_tasks: compare.yml
  loop: "{{ shell_cases }}"
  loop_control:
    loop_var: case
    label: "{{ case.name }}"

- name: The shell from ansible_shell_executable
  ansible.builtin.include_tasks: shell_executable.yml

- name: Free-form commands are split like ansible.builtin.shell
  ansible.builtin.include_tasks: free_form.yml
  # Before ansible-core 2.19, only the builtin can take a free-form string:
  # the task parser rejects it for other modules when loading the playbook.
  when: ansible_version.full is version('2.19', '>=')

- name: Async
  ansible.builtin.include_tasks: async.yml
