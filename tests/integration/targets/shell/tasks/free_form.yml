# Free-form task lines are split like ansible.builtin.shell: k=v words that
# aren't module options (FOO=bar) stay in the command, which is passed to the
# shell as one string; chdir=/creates= options are taken out. Each pair must
# give the same cmd, stdout, rc, changed and msg.
- vars:
    word: templated
  block:
    - ansible.builtin.shell: FOO=bar sh -c 'echo $FOO {{ word }}' | tr a-z A-Z
      register: b1
    - compiled.builtin.shell: FOO=bar sh -c 'echo $FOO {{ word }}' | tr a-z A-Z
      register: c1

    - ansible.builtin.shell: echo created > made.txt chdir={{ shell_dir }} creates=exists.txt
      register: b2
    - compiled.builtin.shell: echo created > made.txt chdir={{ shell_dir }} creates=exists.txt
      register: c2

    - action: ansible.builtin.shell echo x=1 | cat
      register: b3
    - action: compiled.builtin.shell echo x=1 | cat
      register: c3

    - name: Free-form results match
      ansible.builtin.assert:
        that:
          - item.0.cmd == item.1.cmd
          - item.0.stdout == item.1.stdout
          - item.0.rc == item.1.rc
          - item.0.changed == item.1.changed
          - item.0.msg == item.1.msg
        fail_msg: "ansible.builtin: {{ item.0 }}\ncompiled.builtin: {{ item.1 }}"
      loop: "{{ [[b1, c1], [b2, c2], [b3, c3]] }}"
      loop_control:
        label: "{{ item.0.cmd }}"
