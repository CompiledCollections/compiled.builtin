# Async works like the builtin: fire and forget followed by async_status.
# (Ansible's async wrapper needs Python on the target.)
- name: Run in the background
  compiled.builtin.shell:
    cmd: sleep 1; echo done | tr a-z A-Z
  async: 30
  poll: 0
  register: job

- name: Wait for it
  ansible.builtin.async_status:
    jid: "{{ job.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 30
  delay: 1

- ansible.builtin.assert:
    that:
      - job_result.stdout == 'DONE'
      - job_result.rc == 0
