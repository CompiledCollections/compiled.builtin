slurp_dir: "{{ output_dir }}/slurp"

# Each case runs ansible.builtin.slurp and compiled.builtin.slurp with the
# same arguments; the results must match. The files are made by tasks/main.yml.
slurp_cases:
  # Content
  - name: text file
    args: {src: "{{ slurp_dir }}/text.txt"}
  - name: binary file
    args: {src: "{{ slurp_dir }}/binary.bin"}
  - name: empty file
    args: {src: "{{ slurp_dir }}/empty.txt"}
  - name: unicode file
    args: {src: "{{ slurp_dir }}/unicode.txt"}
  - name: large file
    args: {src: "{{ slurp_dir }}/large.bin"}
  - name: file in /proc
    args: {src: /proc/version}

  # armor
  - name: armor false on text
    args: {src: "{{ slurp_dir }}/unicode.txt", armor: false}
  - name: armor false on binary
    args: {src: "{{ slurp_dir }}/binary.bin", armor: false}
  - name: armor true
    args: {src: "{{ slurp_dir }}/text.txt", armor: true}
  - name: armor as a string
    args: {src: "{{ slurp_dir }}/text.txt", armor: "no"}

  # Paths
  - name: path alias
    args: {path: "{{ slurp_dir }}/text.txt"}
  - name: path with a variable
    args: {src: "$SLURP_DIR/text.txt"}
    environment: {SLURP_DIR: "{{ slurp_dir }}"}
  - name: path with ~
    args: {src: "~/{{ slurp_home_file }}"}
  - name: symlink
    args: {src: "{{ slurp_dir }}/link.txt"}
  - name: relative path is not found in the home directory
    args: {src: "relative.txt"}

  # Errors
  - name: missing file
    args: {src: "{{ slurp_dir }}/missing.txt"}
  - name: directory
    args: {src: "{{ slurp_dir }}"}
  - name: unreadable file
    args: {src: "{{ slurp_dir }}/unreadable.txt"}
    # Only fails when not run as root: root reads it anyway.
  - name: symlink loop
    args: {src: "{{ slurp_dir }}/loop"}
  - name: file under a regular file
    args: {src: "{{ slurp_dir }}/text.txt/child"}

  # Modes and arguments
  - name: check mode
    args: {src: "{{ slurp_dir }}/text.txt"}
    check_mode: true
  - name: src is required
    args: {}
  - name: unsupported option
    args: {src: "{{ slurp_dir }}/text.txt", bogus: 1}
