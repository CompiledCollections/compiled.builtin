# The same starting tree on the target for every run, with fixed times so
# runs compare equal: files to overwrite, and a tree for remote_src copies.
- name: Make the starting tree
  ansible.builtin.shell:
    cmd: |
      chmod -R u+rwX "{{ copy_dir }}" 2>/dev/null; rm -rf "{{ copy_dir }}"
      mkdir -p "{{ copy_dir }}/dest" && cd "{{ copy_dir }}" || exit 1
      printf 'hello\n' > dest/same.txt
      printf 'old\n' > dest/old.txt
      mkdir -p dest/dir
      ln -s old.txt dest/link.txt
      mkdir -p rsrc/tree/sub/deep rsrc/tree/empty rsrc/tree/.git
      printf 'hello\n' > rsrc/hello.txt
      printf 'a\n' > rsrc/tree/a.txt
      printf 'b\n' > rsrc/tree/sub/b.txt
      printf 'c\n' > rsrc/tree/sub/deep/c.txt
      printf 'git\n' > rsrc/tree/.git/HEAD
      ln -s a.txt rsrc/tree/link-to-a
      ln -s sub rsrc/tree/link-to-sub
      chmod 0640 rsrc/hello.txt
      find . -exec touch -h -d @1577836800 {} +
      {{ case.setup | default('') }}
    executable: /bin/bash
  changed_when: false
