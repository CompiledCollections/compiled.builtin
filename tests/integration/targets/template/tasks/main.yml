- name: Compare compiled.builtin.template with ansible.builtin.template
  ansible.builtin.include_tasks: compare.yml
  loop: "{{ template_cases }}"
  loop_control:
    loop_var: case
    label: "{{ case.name }}"

- name: Runs without Python on the target
  ansible.builtin.include_tasks: no_python.yml

- name: Let the test framework remove the directory
  ansible.builtin.shell: chmod -R u+rwX "{{ tpl_dir }}" 2>/dev/null || true
