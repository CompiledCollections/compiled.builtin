- name: Start from a fresh directory
  ansible.builtin.shell: rm -rf "{{ rep_dir }}" && mkdir -p "{{ rep_dir }}"

- name: Write the starting content
  ansible.builtin.copy:
    content: "{{ case.content }}"
    dest: "{{ rep_file }}"
    mode: "{{ case.file_mode | default('0644') }}"
  when: case.content is defined

- name: Write the starting bytes
  ansible.builtin.shell: printf '%s' '{{ case.content_b64 }}' | base64 -d > "{{ rep_file }}" && chmod 0644 "{{ rep_file }}"
  when: case.content_b64 is defined

- name: Link to the file
  ansible.builtin.file:
    src: "{{ rep_file }}"
    dest: "{{ rep_dir }}/link.txt"
    state: link
  when: case.symlink | default(false)

- name: Module arguments
  ansible.builtin.set_fact:
    module_args: >-
      {{ ({} if case.no_path | default(false)
          or case.args.keys() | intersect(['path', 'dest', 'destfile', 'name'])
          else {'path': rep_file}) | combine(case.args) }}
