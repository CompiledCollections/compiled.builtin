- name: Set up files for creates/removes and execution failures
  ansible.builtin.shell: |
    rm -rf "{{ cmd_dir }}"
    mkdir -p "{{ cmd_dir }}/hidden" "{{ cmd_dir }}/sub"
    echo x > "{{ cmd_dir }}/exists.txt"
    echo x > "{{ cmd_dir }}/hidden/.dotfile"
    echo x > "{{ cmd_dir }}/sub/inner.txt"
    ln -s "{{ cmd_dir }}/nowhere" "{{ cmd_dir }}/broken_link"
    printf '#!/bin/sh\necho no\n' > "{{ cmd_dir }}/noexec.sh"
    chmod 0644 "{{ cmd_dir }}/noexec.sh"

- name: Compare compiled.builtin.command with ansible.builtin.command
  ansible.builtin.include_tasks: compare.yml
  loop: "{{ command_cases }}"
  loop_control:
    loop_var: case
    label: "{{ case.name }}"

- name: Free-form commands are split like ansible.builtin.command
  ansible.builtin.include_tasks: free_form.yml

- name: Async
  ansible.builtin.include_tasks: async.yml

- name: Timing values
  ansible.builtin.include_tasks: timing.yml
