- name: "{{ case.name }} | ansible.builtin.command"
  ansible.builtin.command:
  args: "{{ case.args }}"
  check_mode: "{{ case.check_mode | default(false) }}"
  environment: "{{ case.environment | default({}) }}"
  register: builtin
  ignore_errors: true

- name: "{{ case.name }} | compiled.builtin.command"
  compiled.builtin.command:
  args: "{{ case.args }}"
  check_mode: "{{ case.check_mode | default(false) }}"
  environment: "{{ case.environment | default({}) }}"
  register: compiled
  ignore_errors: true

- name: "{{ case.name }} | results match"
  vars:
    # Python lists valid booleans from a set, in an order that changes per process.
    set_order: 'Valid booleans include: [^"]*'
    volatile: [ansible_facts, invocation, exception, module_stderr, start, end, delta]
    want: "{{ builtin | dict2items | rejectattr('key', 'in', volatile) | items2dict | to_nice_json(sort_keys=true) | replace('ansible.builtin.', 'MODULE.') | replace('ansible.legacy.', 'MODULE.') | regex_replace(set_order, '') }}"
    got: "{{ compiled | dict2items | rejectattr('key', 'in', volatile) | items2dict | to_nice_json(sort_keys=true) | replace('compiled.builtin.', 'MODULE.') | regex_replace(set_order, '') }}"
  ansible.builtin.assert:
    that:
      - want == got
      # Timing values are present in the same cases
      - (builtin.start | default(none) is none) == (compiled.start | default(none) is none)
      - (builtin.delta | default(none) is none) == (compiled.delta | default(none) is none)
    fail_msg: "{{ case.name }}: results differ\nansible.builtin: {{ want }}\ncompiled.builtin: {{ got }}"
    quiet: true
