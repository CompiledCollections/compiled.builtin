# compiled.builtin.apk has no builtin to compare with, so the cases check
# what apk did, in Alpine containers without Python: Alpine 3.22 has
# apk-tools 2, later releases apk-tools 3.
- name: Run the cases in each container, then stop it
  ansible.builtin.include_tasks: container.yml
  loop:
    - {container: cgm-apk-322, image: "docker.io/library/alpine:3.22"}
    - {container: cgm-apk-latest, image: "docker.io/library/alpine:latest"}
  loop_control:
    loop_var: target
    label: "{{ target.image }}"

- name: Fails where there is no apk
  compiled.builtin.apk:
    name: tar
    state: present
  register: no_apk
  ignore_errors: true
  when: ansible_facts.os_family | default('') != 'Alpine'

- ansible.builtin.assert:
    that:
      - no_apk is failed
      - no_apk.msg is search('apk was not found')
  when: no_apk is not skipped
