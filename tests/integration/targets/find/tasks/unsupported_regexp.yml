# Python regexp features with no RE2 equivalent (lookahead, lookbehind,
# backreferences, verbose mode) in patterns, excludes or contains make the
# compiled module fail with a message naming the feature and RE2, instead of
# matching differently. Only the compiled module runs: the builtin supports
# them.
- name: Unsupported regexp features
  compiled.builtin.find:
    paths: "{{ tree }}"
    use_regex: true
    patterns: "{{ item.patterns | default(omit) }}"
    excludes: "{{ item.excludes | default(omit) }}"
    contains: "{{ item.contains | default(omit) }}"
  register: unsupported
  ignore_errors: true
  loop:
    - {patterns: 'a(?=\.txt)', feature: lookahead}
    - {excludes: '(?<!x)a', feature: lookbehind}
    - {contains: '(h)\1', feature: backreferences}
    - {patterns: '(?x) a', feature: verbose}
  loop_control:
    label: "{{ item }}"

- name: Each fails and says why
  ansible.builtin.assert:
    that:
      - item is failed
      # Before ansible-core 2.19 the message is in module_stderr
      - (item.msg ~ item.module_stderr | default('')) is search(item.item.feature)
      - (item.msg ~ item.module_stderr | default('')) is search('RE2')
    fail_msg: "{{ item | to_json }}"
  loop: "{{ unsupported.results }}"
  loop_control:
    label: "{{ item.item }}"
